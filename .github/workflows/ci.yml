name: CI

on:
  push:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install P
        run: |
          dotnet tool install --global P --version 3.1.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Compile
        run: p compile
